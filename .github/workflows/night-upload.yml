name: Night Upload & Ops (Debug)

on:
  schedule:
    - cron: '*/30 14-23,0-3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - upload
          - status
          - cleanup

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  TZ: 'Asia/Kolkata'

jobs:
  night-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout repository
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ──────────────────────────────────────────────
      # 2. Show repo structure (DEBUG)
      # ──────────────────────────────────────────────
      - name: Show repo files
        run: |
          echo "=== Files in repo ==="
          find . -type f -not -path './.git/*' | sort
          echo ""
          echo "=== Shorts folder ==="
          ls -la shorts/ 2>/dev/null || echo "No shorts/ folder"
          echo ""
          echo "=== State folder ==="
          ls -la state/ 2>/dev/null || echo "No state/ folder"

      # ──────────────────────────────────────────────
      # 3. Setup Python + deps
      # ──────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install instagrapi yt-dlp python-dotenv requests --break-system-packages

      # ──────────────────────────────────────────────
      # 4. Restore credentials from secrets
      # ──────────────────────────────────────────────
      - name: Restore credentials
        env:
          PUBLISHER_AUTH: ${{ secrets.PUBLISHER_AUTH }}
          PUBLISHER_COOKIES: ${{ secrets.PUBLISHER_COOKIES }}
          PUBLISHER_SESSION: ${{ secrets.PUBLISHER_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          echo "=== Checking secrets ==="
          if [ -z "$PUBLISHER_AUTH" ]; then echo "⚠️ PUBLISHER_AUTH not set"; fi
          if [ -z "$PUBLISHER_COOKIES" ]; then echo "⚠️ PUBLISHER_COOKIES not set"; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "⚠️ TELEGRAM_BOT_TOKEN not set"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "⚠️ TELEGRAM_CHAT_ID not set"; fi
          
          echo "$PUBLISHER_AUTH" > publisher_auth.json
          echo "$PUBLISHER_COOKIES" > publisher_cookies.json
          echo "$PUBLISHER_SESSION" > publisher_session.json
          cat > .env <<EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
          EOF

      # ──────────────────────────────────────────────
      # 5. Run pipeline (debug mode by default)
      # ──────────────────────────────────────────────
      - name: Run pipeline
        id: run
        env:
          MODE: ${{ github.event.inputs.mode || 'debug' }}
        run: |
          MODE="${MODE:-debug}"
          echo "=== Mode: $MODE ==="
          
          if [ "$MODE" = "debug" ]; then
            echo "🔍 DEBUG MODE - No upload performed"
            echo "=== Python version ==="
            python --version
            echo "=== Instagram login test ==="
            python -c "
from instagrapi import Client
import json, os
cl = Client()
# Try cookie login
if os.path.exists('publisher_cookies.json'):
    raw = json.loads(open('publisher_cookies.json').read())
    items = raw if isinstance(raw, list) else raw.get('cookies', [])
    sid = next((c.get('value') for c in items if isinstance(c, dict) and c.get('name') == 'sessionid'), None)
    if sid:
        try:
            cl.login_by_sessionid(sid)
            print(f'✅ Cookie login OK: @{cl.username}')
        except Exception as e:
            print(f'❌ Cookie login failed: {e}')
    else:
        print('⚠️ No sessionid in cookies')
    # Try session
    if os.path.exists('publisher_session.json'):
        try:
            cl.load_settings('publisher_session.json')
            cl.login('user', 'pass')
            print(f'✅ Session login OK: @{cl.username}')
        except Exception as e:
            print(f'⚠️ Session login failed: {e}')
    print('=== Login test complete ===')
            "
          elif [ "$MODE" = "upload" ]; then
            echo "🚀 Running night upload..."
            python upload_shorts.py || echo "⚠️ Upload step exited non-zero"
          elif [ "$MODE" = "status" ]; then
            echo "📊 Running status check..."
            python telegram_bot.py --status || true
          elif [ "$MODE" = "cleanup" ]; then
            echo "🧹 Running cleanup..."
            python cleanup_shorts.py || true
          else
            echo "Unknown mode: $MODE"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 6. Commit state changes
      # ──────────────────────────────────────────────
      - name: Commit state changes
        if: github.event.inputs.mode == 'upload' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Night ops: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ State committed and pushed"
          else
            echo "No changes to commit"
          fi

      # ──────────────────────────────────────────────
      # 7. Telegram summary (always runs)
      # ──────────────────────────────────────────────
      - name: Send Telegram summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'debug' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "
import os, json, requests, sys
from datetime import datetime

token = os.getenv('TELEGRAM_BOT_TOKEN')
chat = os.getenv('TELEGRAM_CHAT_ID')
mode = os.getenv('MODE', 'debug')
status = os.getenv('JOB_STATUS', 'unknown')

if not token or not chat:
    print('Telegram not configured')
    sys.exit(0)

icon = {'success': '✅', 'failure': '❌', 'cancelled': '⚠️'}.get(status, 'ℹ️')
text = f'{icon} <b>Night Ops Complete</b>\n'
text += f'🕐 {datetime.utcnow().strftime(\"%Y-%m-%d %H:%M UTC\")}\n'
text += f'⚙️ Mode: <code>{mode}</code>\n'
text += f'📊 Status: <b>{status.upper()}</b>\n'
text += f'🔗 <a href=\"https://github.com/{os.getenv(\"GITHUB_REPOSITORY\")}/actions/runs/{os.getenv(\"GITHUB_RUN_ID\")}\">View Run</a>'

requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={
    'chat_id': chat, 'text': text, 'parse_mode': 'HTML', 'disable_web_page_preview': True
}, timeout=10)
"