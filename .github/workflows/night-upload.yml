name: Night Upload & Ops

# GitHub owns all five slots (see slots.json); the local PC never uploads to Instagram.
# Local PC only builds shorts + captions + thumbnails, pushes to GitHub, then shuts down.
# GitHub node pulls, uploads due shorts to Instagram at each Option A slot, commits state.
on:
  schedule:
    - cron: '0 22 * * *'   # Slot 1: EST 5 PM — Pre-peak
    - cron: '0 23 * * *'   # Slot 2: EST 6 PM — Early evening
    - cron: '0 0 * * *'    # Slot 3: EST 7 PM — Prime time start
    - cron: '0 1 * * *'    # Slot 4: EST 8 PM — Prime time peak
    - cron: '0 2 * * *'    # Slot 5: EST 9 PM — Late peak
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: false
        default: 'upload'
        type: choice
        options:
          - upload
          - status
          - cleanup

concurrency:
  group: night-ops
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  TZ: 'UTC'
  PIPELINE_NODE: github
  PYTHONUNBUFFERED: '1'

jobs:
  night-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore credentials
        env:
          PUBLISHER_AUTH: ${{ secrets.PUBLISHER_AUTH }}
          PUBLISHER_COOKIES: ${{ secrets.PUBLISHER_COOKIES }}
          PUBLISHER_SESSION: ${{ secrets.PUBLISHER_SESSION }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          files = {
              "publisher_auth.json": os.getenv("PUBLISHER_AUTH", ""),
              "publisher_cookies.json": os.getenv("PUBLISHER_COOKIES", ""),
              "publisher_session.json": os.getenv("PUBLISHER_SESSION", ""),
          }
          for name, raw in files.items():
              if raw.strip():
                  Path(name).write_text(raw, encoding="utf-8")
                  print(f"restored {name} ({len(raw)} bytes)")
              else:
                  print(f"WARNING: secret for {name} is not set")

          env_lines = [
              f"TELEGRAM_BOT_TOKEN={os.getenv('TELEGRAM_BOT_TOKEN', '')}",
              f"TELEGRAM_CHAT_ID={os.getenv('TELEGRAM_CHAT_ID', '')}",
              f"TELEGRAM_ALLOWED_USERS={os.getenv('TELEGRAM_ALLOWED_USERS', '')}",
              f"OPENROUTER_API_KEY={os.getenv('OPENROUTER_API_KEY', '')}",
          ]
          Path(".env").write_text("\n".join(env_lines) + "\n", encoding="utf-8")
          PY

      - name: Repo state
        run: |
          echo "Slot: ${{ github.event.schedule || 'manual' }}"
          ls -la shorts/ 2>/dev/null | head -30 || echo "no shorts/ folder"
          du -sh shorts 2>/dev/null || true

      - name: Report node status (start)
        run: python pipeline_status.py --start --note "night upload ${{ github.event.schedule || 'manual' }}" --notify --quiet || true

      - name: Upload due shorts to Instagram
        id: run
        env:
          MODE: ${{ github.event.inputs.mode || 'upload' }}
        run: |
          MODE="${MODE:-upload}"
          case "$MODE" in
            upload)
              echo "Posting every due slot owned by github at Option A time"
              python upload_shorts.py || echo "::warning::upload step exited non-zero"
              python cleanup_shorts.py || true
              ;;
            cleanup)
              python cleanup_shorts.py
              ;;
            status|*)
              python pipeline_status.py
              ;;
          esac

      - name: Commit state + shorts
        if: github.event.inputs.mode == 'upload' || github.event.inputs.mode == 'cleanup' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- shorts state
          if git diff --staged --quiet; then
            echo "no repository changes"
          else
            git commit -m "chore(github): night upload $(date -u +'%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3; do
              if git push; then echo "pushed"; break; fi
              echo "push failed (attempt $attempt) — rebasing and retrying"
              git pull --rebase --autostash || git rebase --abort || true
              sleep 5
            done
          fi

      - name: Report final status
        if: always()
        run: |
          python pipeline_status.py \
            --record \
            --result "${{ job.status }}" \
            --note "${{ github.event.inputs.mode || 'schedule' }}" \
            --notify --quiet || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- state/nodes.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(github): node status ${{ job.status }}"
            git push || true
          fi
